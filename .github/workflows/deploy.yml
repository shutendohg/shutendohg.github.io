name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Keep in sync with `engines.node` and ci.yml.
          node-version: 22
          cache: npm
      # Deliberately not withastro/action: it installs with `npm install`, which
      # is free to resolve newer versions than the lockfile pins. CI gates pull
      # requests with `npm ci`, so the deploy has to install the same way or a
      # green pull request would not mean main deploys.
      - run: npm ci
      - run: npm run build
      # ci.yml only gates pull requests. A merge commit can differ from the
      # branch that was tested, so run the smoke tests here too; a failure
      # keeps the broken build from reaching Pages.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
