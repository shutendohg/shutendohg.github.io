name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site is built from the repository root, so no `path` input is needed.
      # The package manager is detected from the lockfile (npm).
      - uses: withastro/action@v4
        with:
          # Deliberate pin, not a fix for a broken default: withastro/action@v4
          # already defaults to 22, but the default drifts (main is on 24). Pin to
          # the floor declared in `engines` so CI keeps matching it.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
